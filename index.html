    <style>
        /* ============================================================
        STAR AI — DESIGN TOKENS (PROFESSIONAL ORIGINAL CSS)
        ============================================================ */
         :root {
            --bg-void: #07080d;
            --bg-elevated: #0b0d15;
            --bg-panel: #0e111b;
            --glass-fill: rgba(255, 255, 255, 0.035);
            --glass-fill-strong: rgba(255, 255, 255, 0.065);
            --glass-border: rgba(255, 255, 255, 0.09);
            --glass-border-bright: rgba(255, 255, 255, 0.16);
            --indigo: #6366f1;
            --indigo-soft: #818cf8;
            --violet: #8b5cf6;
            --violet-soft: #a78bfa;
            --glow-indigo: rgba(99, 102, 241, 0.55);
            --glow-violet: rgba(139, 92, 246, 0.45);
            --text-primary: #eef0f8;
            --text-secondary: #9296a8;
            --text-tertiary: #5a5e70;
            --success: #34d399;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --ease: cubic-bezier(.22, .9, .32, 1);
        }
        
        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }
        
        html, body {
            height: 100%; overflow: hidden; background: var(--bg-void); color: var(--text-primary); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
        }
        
        /* BACKGROUND ELEMENTS */
        .cosmic-field {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 900px 600px at 14% -10%, rgba(99, 102, 241, 0.16), transparent 60%), radial-gradient(ellipse 800px 700px at 108% 30%, rgba(139, 92, 246, 0.13), transparent 60%), linear-gradient(var(--bg-void), var(--bg-void));
        }
        .cosmic-field::before {
            content: ""; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 64px 64px; mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, #000 30%, transparent 85%);
        }
        .cosmic-orb {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35; animation: drift 22s ease-in-out infinite;
        }
        .cosmic-orb.o1 { width: 420px; height: 420px; top: -140px; left: 18%; background: radial-gradient(circle, var(--glow-indigo), transparent 70%); }
        .cosmic-orb.o2 { width: 380px; height: 380px; bottom: -120px; right: 8%; background: radial-gradient(circle, var(--glow-violet), transparent 70%); animation-delay: -9s; }
        @keyframes drift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -24px) scale(1.08); } }

        /* SHELL AND SIDEBAR CODE */
        .app-shell {
            position: relative; z-index: 1; display: flex; height: 100vh; width: 100vw; overflow: hidden;
        }
        .sidebar {
            width: 272px; flex-shrink: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--bg-elevated), var(--bg-void)); border-right: 1px solid var(--glass-border); padding: 26px 18px 20px; gap: 28px;
        }
        .brand-name { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; background: linear-gradient(120deg, #fff, var(--indigo-soft) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 1.6px; color: var(--text-tertiary); text-transform: uppercase; }
        
        .nav-section { display: flex; flex-direction: column; gap: 6px; }
        .nav-section-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 6px; }
        
        .nav-btn {
            display: flex; align-items: center; width: 100%; padding: 12px 14px; background: transparent; border: none; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 14px; font-weight: 500; gap: 12px; transition: all 0.2s var(--ease); text-align: left;
        }
        .nav-btn:hover, .nav-btn.active {
            background: var(--glass-fill-strong); color: var(--text-primary); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .nav-btn.active { border-left: 3px solid var(--indigo); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding-left: 11px; background: rgba(99, 102, 241, 0.08); color: var(--indigo-soft); }

        /* MAIN CONTENT AND CHAT WINDOW */
        .main-content {
            flex: 1; display: flex; flex-direction: column; background: rgba(7, 8, 13, 0.4); backdrop-filter: blur(8px);
        }
        .chat-history {
            flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px;
        }
        
        /* CHAT BUBBLES GRAPHICS LAYER */
        .msg {
            max-width: 70%; padding: 16px 20px; border-radius: var(--radius-md); line-height: 1.6; font-size: 14.5px; position: relative; animation: fadeIn 0.3s var(--ease) forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg.user {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15)); border: 1px solid rgba(99, 102, 241, 0.25); align-self: flex-end; box-shadow: 0 8px 32px -8px rgba(99, 102, 241, 0.15); border-bottom-right-radius: 4px;
        }
        .msg.bot {
            background: var(--bg-panel); border: 1px solid var(--glass-border); align-self: flex-start; box-shadow: 0 12px 40px -12px rgba(0,0,0,0.5); border-bottom-left-radius: 4px;
        }

        /* INPUT HUB LAYOUT */
        .input-outer-container {
            padding: 24px 40px 32px; background: linear-gradient(180deg, transparent, var(--bg-void) 40%);
        }
        .input-container {
            background: var(--bg-panel); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 20px 50px -12px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.02); transition: border 0.2s var(--ease);
        }
        .input-container:focus-within { border-color: rgba(99, 102, 241, 0.4); }
        
        input {
            flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 14.5px; outline: none; font-family: inherit;
        }
        input::placeholder { color: var(--text-tertiary); }
        
        .send-btn {
            background: linear-gradient(135deg, var(--indigo), var(--violet)); border: none; width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; transition: all 0.2s var(--ease); box-shadow: 0 4px 12px var(--glow-indigo);
        }
        .send-btn:hover { transform: scale(1.03); filter: brightness(1.1); }
    </style>
</head>
