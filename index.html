<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/star.png">
    <meta name="author" content="Khizran - Full-Stack Developer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star AI — Generation Cockpit</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-void: #07080d; --bg-elevated: #0b0d15; --bg-panel: #0e111b;
            --glass-border: rgba(255, 255, 255, 0.09); --indigo: #6366f1;
            --text-primary: #eef0f8; --text-secondary: #9296a8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-void); color: var(--text-primary); font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .app-shell { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 272px; background: var(--bg-elevated); border-right: 1px solid var(--glass-border); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .nav-btn { background: transparent; border: none; color: var(--text-secondary); text-align: left; padding: 10px; font-size: 14px; border-radius: 8px; width: 100%; margin-bottom: 5px; }
        .nav-btn.active, .nav-btn:hover { background: rgba(99, 102, 241, 0.15); color: #fff; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-panel); position: relative; }
        .chat-history { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .input-container { padding: 20px; border-top: 1px solid var(--glass-border); display: flex; gap: 12px; background: var(--bg-elevated); }
        input { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px 20px; color: #fff; font-size: 14px; outline: none; }
        button.send-btn { background: var(--indigo); border: none; border-radius: 12px; padding: 0 24px; color: #fff; font-weight: 600; cursor: pointer; }
        .msg { max-width: 75%; padding: 12px 18px; border-radius: 12px; line-height: 1.5; font-size: 14.5px; }
        .msg.user { background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99,102,241,0.4); align-self: flex-end; }
        .msg.bot { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); align-self: flex-start; }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h2 style="font-family:'Space Grotesk'; font-size:22px; color: #fff;">Star.AI</h2>
            <p style="font-family:'JetBrains Mono'; font-size:10px; color:var(--text-secondary);">COCKPIT V4.2</p>
            <div style="margin-top:20px;">
                <button class="nav-btn active" onclick="setMode('text', this)">💬 AI Chat Engine</button>
                <button class="nav-btn" onclick="setMode('image', this)">🎨 Image Studio</button>
            </div>
        </div>

        <!-- MAIN APP WINDOW -->
        <div class="main-content">
            <div class="chat-history" id="chatArea">
                <div class="msg bot">Welcome to Star AI Core Hub Engine! Describe what you want to create or ask...</div>
            </div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Describe what you want to create or ask...">
                <button class="send-btn" id="sendBtn" onclick="executeGeneration()">Send</button>
            </div>
        </div>
    </div>

    <!-- CORE LIVE CONNECTOR ENGINE -->
    <script>
        let currentMode = 'text';

        function setMode(mode, element) {
            currentMode = mode;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        async function executeGeneration() {
            const inputEl = document.getElementById('userInput');
            const chatArea = document.getElementById('chatArea');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            // 1. Append User Text Node
            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.textContent = prompt;
            chatArea.appendChild(userMsg);
            inputEl.value = '';
            chatArea.scrollTop = chatArea.scrollHeight;

            // 2. Append Live Status Buffer Loader
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'msg bot';
            loadingMsg.style.color = 'var(--text-secondary)';
            loadingMsg.textContent = 'Star AI Core Node processing pipeline...';
            chatArea.appendChild(loadingMsg);

            try {
                if (currentMode === 'text') {
                    const response = await fetch('/api/generate/text', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt })
                    });
                    const data = await response.json();
                    loadingMsg.remove();

                    const botMsg = document.createElement('div');
                    botMsg.className = 'msg bot';
                    botMsg.style.whiteSpace = 'pre-wrap';
                    botMsg.textContent = data.status === 'success' ? data.output : 'Pipeline connection failure.';
                    chatArea.appendChild(botMsg);
                } 
                else if (currentMode === 'image') {
                    const response = await fetch('/api/generate/image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt })
                    });
                    const data = await response.json();
                    loadingMsg.remove();

                    const botMsg = document.createElement('div');
                    botMsg.className = 'msg bot';
                    if (data.status === 'success') {
                        botMsg.innerHTML = `<img src="${data.outputUrl}" alt="AI Gen" style="width:100%; max-width:450px; border-radius:10px; margin-top:5px; border:1px solid rgba(255,255,255,0.1);"/>`;
                    } else {
                        botMsg.textContent = 'Image generation system error.';
                    }
                    chatArea.appendChild(botMsg);
                }
                chatArea.scrollTop = chatArea.scrollHeight;
            } catch (err) {
                loadingMsg.remove();
                const errorMsg = document.createElement('div');
                errorMsg.className = 'msg bot';
                errorMsg.style.color = '#ef4444';
                errorMsg.textContent = 'Network Timeout. Verify local server gateway mapping.';
                chatArea.appendChild(errorMsg);
            }
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeGeneration();
        });
    </script>
</body>
</html>
